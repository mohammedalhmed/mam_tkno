name: Render Social Preview

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/portfolio/cover.svg"
      - ".github/workflows/render-social-preview.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render PNG
        run: |
          mkdir -p docs/portfolio
          rsvg-convert -w 1280 -h 640 docs/portfolio/cover.svg -o docs/portfolio/social-preview.png

      - name: Commit social preview
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render GitHub social preview"
          file_pattern: "docs/portfolio/social-preview.png"
